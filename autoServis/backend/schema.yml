        name: id
        schema:
          type: integer
        description: A unique integer value identifying this order.
        required: true
      - in: path
        name: item_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      - in: path
        name: kind
        schema:
          type: string
          pattern: ^services|parts$
        required: true
      tags:
