          - ASSIGNED
          - CANCELLED
          - COMPLETED
          - DIAGNOSTICS
          - IN_PROGRESS
          - NEW
          - PAID
        description: |-
          * `NEW` - Yangi
          * `DIAGNOSTICS` - Diagnostika
          * `ASSIGNED` - Biriktirilgan
          * `IN_PROGRESS` - Jarayonda
          * `COMPLETED` - Tugallangan
          * `PAID` - To‘langan
          * `CANCELLED` - Bekor qilingan
